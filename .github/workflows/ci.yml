name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Lance 0.25 overflows rustc's query-depth limit on 1.96 and newer. Keep all
# jobs on the newest verified toolchain until the LanceDB dependency is upgraded.

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.120.0
        with:
          components: clippy
          targets: ${{ matrix.target }}

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check
        run: cargo check --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test (lib)
        run: cargo test --lib --workspace

      - name: Test (integration)
        run: cargo test --workspace --test '*'

      - name: Test (doc)
        run: cargo test --workspace --doc

      # Verus formal proofs are NOT run here. They require a pinned nightly
      # toolchain and Z3, which would add significant CI overhead. See VERUS.md
      # for manual verification instructions.

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: [test]
    # Heavy audits run on main and release tags only; pull requests get the
    # fast check/clippy/test gate above.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.120.0
      - name: Run cargo audit
        run: cargo audit
      - name: Run cargo deny
        run: cargo deny check

  stability-audit:
    name: Stability Audit
    runs-on: ubuntu-latest
    needs: [test, security-audit]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.120.0
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run Stability Audit
        run: cargo run --release -- --audit-only --cases 1000

  release:
    name: Release build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: [stability-audit]
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: crosstalk
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: crosstalk
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: crosstalk.exe

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.120.0
        with:
          targets: ${{ matrix.target }}

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build release (Optimized)
        run: cargo build --release --target ${{ matrix.target }}

      - name: Generate Shell Completions
        run: cargo run --release --bin crosstalk -- --generate-completions zsh bash fish

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: crosstalk-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact }}
